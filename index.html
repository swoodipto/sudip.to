    <style>
:root {
    --base-size: 1.6vh;
    --scale: 1;

    /* TYPE */
    --system-font: "DM Sans",ui-sans-serif,system-ui,sans-serif,Apple Color Emoji,Segoe UI Emoji,Segoe UI Symbol,Noto Color Emoji;
    --type: 500 normal .9rem/1.2rem var(--system-font);
    --brand-ls: -0.007rem;

    /* COLORS */
    --white: #fff;
    --slate: #F7F8FA;
    --slate-gray: #EFF0F2;
    --slate-deep: #d8dadf;
    --slate-gray-deep: #cacdd5;

    --gray: #bcc1cf;
    --gray-dark: #9298a5;

    --primary-h: 255;
    --primary-s: 100%;
    --primary-l: 50%;

    --primary: hsl(var(--primary-h), var(--primary-s), var(--primary-l));
    --primary-alpha: hsla(var(--primary-h), var(--primary-s), var(--primary-l), 0.65);
    --primary-alpha-h: hsla(var(--primary-h), var(--primary-s), var(--primary-l), 0.09);

    --primary-dark: hsl(var(--primary-h), var(--primary-s), calc(var(--primary-l) / 1.6));
    --primary-dark-alpha: hsla(var(--primary-h), var(--primary-s), calc(var(--primary-l) / 1.6), 0.5);

    --primary-deep: hsl(var(--primary-h), var(--primary-s), calc(var(--primary-l) / 3.2));
    --primary-deep-alpha: hsla(var(--primary-h), var(--primary-s), calc(var(--primary-l) / 3.2), 0.5);

    --primary-black: hsl(var(--primary-h), var(--primary-s), calc(var(--primary-l) / 5));
    --primary-black-alpha: hsla(var(--primary-h), var(--primary-s), calc(var(--primary-l) / 5), 0.5);
    --primary-black-alpha-h: hsla(var(--primary-h), var(--primary-s), calc(var(--primary-l) / 5), 0.25);

    --fg-primary: var(--primary-black);
    --fg-secondary: var(--primary-black-alpha);

    --contrastThreshold: 60%;

    --sexy-bounce: cubic-bezier(0.18, 0.89, 0.31, 1.57);

    /* NUMS */
    --num-full: 999;

    --master-gap: 1.4rem;
    --gap-1: calc(var(--master-gap) * 0.6);
    --gap-2: calc(var(--gap-1) * 0.6);
}

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
}

html {
  font-size: calc(var(--base-size) * var(--scale));
}

::selection {
    background-color: var(--primary);
    color: var(--white);
}

::-moz-selection {
    background-color: var(--primary);
    color: var(--white);
}

.no-sel {
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
}

body {
    /* background-color: var(--slate); */
    font: var(--type);
    letter-spacing: var(--brand-ls);
    color: var(--fg-primary);

    background: linear-gradient(to top, var(--slate-gray), var(--slate-gray), var(--slate), var(--slate));
    background-size: cover;
    background-size: 100% 0.28rem;

    display: flex;
    height: 100vh;
    min-height: 740px;
    align-items: center;
}

a:not(.btn) {
    position: relative;
    text-decoration: none;
    color: var(--primary);
    padding: 0.0625rem 0.25rem;
    border-radius: 0.25rem;
}

a:not(.btn):not([class]):hover {
    background-color: var(--primary-alpha-h);
}

img {
  width: 100%;
  height: auto;
}

.btn {
    display: inline-block;
    font-weight: 600;
    background-color: var(--primary);
    letter-spacing: -0.006rem;
    --switch: calc((var(--primary-l) - var(--contrastThreshold)) * -100);
    color: hsl(0, 0%, var(--switch));
    padding: 0.5rem 1.25rem;
    border-radius: 62.5rem;
    text-decoration: none;
    transform: translateY(0);
    transition: all 0.28s var(--sexy-bounce);
}

.btn:hover {
    transform: translateY(-0.25rem);
    box-shadow: 0 0.75rem 1.5rem -0.5rem var(--primary-dark-alpha);
}

.btn:active {
    background-color: var(--primary-dark);
    transform: translateY(0);
    box-shadow: 0 0.25rem 0.5rem -0.125rem var(--primary-deep-alpha);
}

.aqua {
  background: repeating-linear-gradient(rgba(0, 0, 162, 0.475), rgba(0, 0, 168, 0.408) 1px, rgba(0, 0, 183, 0.41) 2px, rgba(255, 255, 255, 0.01) 3.5px), linear-gradient(rgba(0, 0, 250, 0.625), rgba(0, 0, 200, 0.625), rgba(0, 0, 250, 0.625));
  box-shadow: 
  0 0.8rem 1.4rem -0.2rem rgba(0, 0, 250, 0.38), 
  0 0.05rem 0.125rem rgba(0, 0, 200, 0.5), 
  inset 0 0.23rem 0.46rem rgba(0, 0, 200, 0.8), 
  inset 0 0.35rem 0.46rem 0.23rem rgba(0, 0, 200, 0.75);
}

.aqua:hover {
  box-shadow: 
  0 0.925rem 1.67rem -0.231rem rgba(0, 0, 250, 0.48),
  0 0.1875rem 0.556rem -0.1875rem rgba(0, 0, 200, 0.5),
  inset 0 0.231rem 0.4625rem rgba(0, 0, 200, 0.8),
  inset 0 0.35rem 0.4625rem 0.231rem rgba(0, 0, 200, 0.75);
}

.aqua:active {
    background: repeating-linear-gradient(rgba(0, 0, 162, 0.475), rgba(0, 0, 168, 0.408) 1px, rgba(0, 0, 183, 0.41) 2px, rgba(255, 255, 255, 0.01) 3.5px), linear-gradient(rgba(0, 0, 250, 0.625), rgba(0, 0, 200, 0.625), rgba(0, 0, 250, 0.625));
    box-shadow: 
  0 0.556rem 0.925rem -0.1375rem rgba(0, 0, 154, 0.6),
  0 0.09375rem 0.08125rem rgba(0, 0, 200, 0.6),
  inset 0 0.231rem 0.4625rem rgba(0, 0, 200, 0.8),
  inset 0 0.35rem 0.4625rem 0.231rem rgba(0, 0, 200, 0.75);
}

.slate {
  background: repeating-linear-gradient(rgba(0, 0, 0, 0.45) 2px, rgba(0, 0, 0, 0.6) 6px),
              linear-gradient(rgba(50, 50, 50, 0.625), rgba(255, 255, 255, 0.625));
  box-shadow: 
  0 0.744rem 1.294rem -0.1875rem rgba(60, 60, 60, 0.45),
  0 0.04375rem 0.11875rem rgba(60, 60, 60, 0.5),
  inset 0 0.231rem 0.4625rem rgba(60, 60, 60, 0.8),
  inset 0 0.35rem 0.4625rem 0.231rem rgba(60, 60, 60, 0.75);
}

.slate:hover {
  box-shadow: 
  0 0.744rem 1.294rem -0.16875rem rgba(60, 60, 60, 0.55),
  0 0.04375rem 0.11875rem rgba(60, 60, 60, 0.5),
  inset 0 0.231rem 0.4625rem rgba(60, 60, 60, 0.8),
  inset 0 0.35rem 0.4625rem 0.231rem rgba(60, 60, 60, 0.75);

}

.slate:active {
  background: repeating-linear-gradient(rgba(0, 0, 0, 0.4) 2px, rgba(0, 0, 0, 0.6) 6px),
              linear-gradient(rgba(50, 50, 50, 0.625), rgba(255, 255, 255, 0.625));
  box-shadow: 
  0 0.556rem 0.925rem -0.1375rem rgba(60, 60, 60, 0.6),
  0 0.09375rem 0.08125rem rgba(60, 60, 60, 0.6),
  inset 0 0.231rem 0.4625rem rgba(60, 60, 60, 0.8),
  inset 0 0.35rem 0.4625rem 0.231rem rgba(60, 60, 60, 0.75);
}


@property --shinetop-1 {
  syntax: '<color>';
  initial-value: rgba(255, 255, 255, 0.8);
  inherits: false;
}

@property --shinetop-2 {
  syntax: '<color>';
  initial-value: rgba(255, 255, 255, 0.2);
  inherits: false;
}

.aqua:before {
  content: "";
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  height: 33%;
  background: linear-gradient(var(--shinetop-1), var(--shinetop-2));
  width: calc(100% - 1.15625rem);
  border-radius: 1.85rem 1.85rem 0.4625rem 0.4625rem;
  top: 5%;
  filter: blur(1px);
  z-index: 2;
  transition: --shinetop-1 .2s ease, --shinetop-2 .2s ease;
}

@property --shinebtm-1 {
  syntax: '<color>';
  initial-value: rgba(120, 120, 255, 0.2);
  inherits: false;
}

@property --shinebtm-2 {
  syntax: '<color>';
  initial-value: rgba(255, 255, 255, 0.6);
  inherits: false;
}

.aqua:after {
  content: "";
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  height: 33%;
  background: linear-gradient(var(--shinebtm-1), var(--shinebtm-2));
  width: calc(100% - 1.15625rem);
  border-radius: 0.69375rem;
  bottom: 10%;
  filter: blur(6px);
  transition: --shinebtm-1 .2s ease, --shinebtm-2 .2s ease;
}

.aqua:hover:before {
    --shinetop-1: rgba(255, 255, 255, 0.9);
    --shinetop-2: rgba(255, 255, 255, 0.4);
}

.aqua:hover:after {
    --shinebtm-1: rgba(255, 255, 255, 0.2);
    --shinebtm-2: rgba(255, 255, 255, 0.8);
}

.aqua:active:before {
    --shinetop-1: rgba(255, 255, 255, 0.5);
    --shinetop-2: rgba(255, 255, 255, 0.2);
}

.aqua:active:after {
    --shinebtm-1: rgba(255, 255, 255, 0.1);
    --shinebtm-2: rgba(255, 255, 255, 0.5);
}

.aqua span {
  position: relative;
  top: -1px;
  z-index: 1;
  transition: all .26s var(--sexy-bounce);
  text-shadow: 0 0.3rem 0.2rem rgba(50, 50, 50, 0.4);
}

.slate span {
  text-shadow: 0 0.3rem 0.2rem rgba(50, 50, 50, 0.4);
}

.aqua:hover span {
    top: -0.1875rem;
}

.aqua:active span {
    top: -0.0625rem;
}

.container {
    padding: 0.69375rem;
    display: grid;
    grid-auto-flow: row;
    grid-gap: var(--master-gap);
    /* max-width: 32rem; */
    margin: 0 auto;
}

.drawer {
  display: grid;
  grid-gap: var(--master-gap);
}

.d-6 {
  grid-template-columns: repeat(6, minmax(auto, 1fr));
}

.header__logo svg {
  width: calc(2.08rem * var(--scale));
  height: auto;
}

nav li {
  list-style: none;
  margin-bottom: 0.4rem;
}

.socials {
  /* font-size: 0.9rem; */
  display: flex;
  flex-direction: row;
  gap: var(--gap-2);
  margin-left: -0.25rem;
}

.footer__wrapper {
  width: 30rem;
  margin: 0 auto;
}

footer {
  position: relative;
  display: grid;
  grid-template-rows: auto;
  grid-gap: var(--gap-1);
  margin-left: calc((2.08rem * var(--scale)) + var(--master-gap));
  z-index: 0;
}

footer .sign__wrap {
  opacity: 1;
  transform-origin: 0 0;
  /* transform: scale(calc(var(--scale) * 0.76)); */
}

footer .sign {
  max-width: 4rem;
  /* margin-top: 0.2rem; */
}

footer .sign svg * {
  stroke-width: 9;
  stroke: var(--primary);
}

.caption {
  display: flex;
  flex-direction: row;
  flex: 1 1 200px;
  gap: var(--master-gap);
  /* font-size: .9rem; */
  line-height: 1.2rem;
  text-shadow: 0 1px 0 rgba(255,255,255,.7);

  width: 30rem;
  margin: 0 auto;
}

.caption__info {
  display: flex;
  flex-direction: column;
  gap: var(--gap-1);
  margin-top: 2.2rem;
}

a.blue__Hover:hover {
  color: #1d69e4;
  background-color: #4286f430;
}

a.black__Hover:hover {
  color: #222222;
  background-color: #2222221f;
}

a.mint__Hover:hover {
  color: #00531d;
  background-color: #00d14939;
}

a.deepBlue__Hover:hover {
  color: #4A50FB;
  background-color: #4a50fb23;
}

a.twitter__Hover:hover {
  color: #007bc8;
  background-color: #1da0f22e;
}

a.insta__Hover:hover {
  color: #c13584;
  background-color: #c1358427;
}

a.yt__Hover:hover {
  color: #dc0000;
  background-color: #ff00001d;
}

.caption__btns {
  display: flex;
  flex-direction: row;
  gap: var(--gap-2);
}

.caption__btns .caption__btn__subtext {
  margin: calc(0.69375rem * 0.2) 0 0 calc(0.69375rem * 1.7);
  font-size: 0.75rem;
  font-weight: 600;
  opacity: .5;
}

.window {
  width: 100%;
  border-radius: 10px;
  overflow: hidden;
  box-shadow:
    0 0 0 1px rgba(0,0,0,.55),
    0 20px 60px -8px rgba(0,0,0,.5),
    inset 0 1px 0 rgba(255,255,255,.35);
  user-select: none;
}

  /* ── Title bar — brushed aluminium ── */
  .titlebar {
    height: 28px;
    background:
      repeating-linear-gradient(
        180deg,
        rgba(255,255,255,.20) 0px, rgba(255,255,255,.20) 1px,
        rgba(0,0,0,.045)      1px, rgba(0,0,0,.045)      2px,
        transparent           2px, transparent            3px
      ),
      linear-gradient(180deg,
        #f2f2f2 0%,
        #e0e0e0 15%,
        #d2d2d2 35%,
        #c6c6c6 52%,
        #bcbcbc 68%,
        #c4c4c4 84%,
        #cecece 100%
      );
    display: flex;
    align-items: center;
    padding: 0 10px;
    border-bottom: 1px solid #7e7e7e;
    position: relative;
    cursor: default;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.95);
  }
  .titlebar.dragging { cursor: grabbing; }

  .traffic-lights { display: flex; gap: 7px; align-items: center; }

  .dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    position: relative;
    cursor: pointer;
    flex-shrink: 0;
  }

  /* shared gloss overlay on every dot */
  .dot::after {
    content: '';
    position: absolute;
    top: 1px; left: 2px;
    width: 70%; height: 55%;
    border-radius: 50% 50% 40% 40% / 60% 60% 40% 40%;
    background: linear-gradient(180deg,
      rgba(255,255,255,.75) 0%,
      rgba(255,255,255,.15) 100%);
    pointer-events: none;
  }

  /* ── Close (red) ── */
  .dot-close {
    background:
      radial-gradient(circle at 50% 115%, #8b0000 0%, transparent 65%),
      radial-gradient(circle at 50% 50%,  #f85b57 30%, #d93025 100%);
    border: 1px solid #ba2520;
    box-shadow:
      inset 0 1px 0 rgba(255,200,190,.55),
      inset 0 -1px 1px rgba(120,0,0,.35),
      0 1px 2px rgba(0,0,0,.35);
  }
  .dot-close:hover {
    background:
      radial-gradient(circle at 50% 115%, #6b0000 0%, transparent 65%),
      radial-gradient(circle at 50% 50%,  #ff7470 30%, #e83830 100%);
  }
  .dot-close:active {
    background: radial-gradient(circle at 50% 50%, #b02018 0%, #8a1810 100%);
    box-shadow: inset 0 1px 3px rgba(0,0,0,.5);
  }

  /* ── Minimize (yellow) ── */
  .dot-min {
    background:
      radial-gradient(circle at 50% 115%, #7a5500 0%, transparent 65%),
      radial-gradient(circle at 50% 50%,  #ffc53d 25%, #e0960a 100%);
    border: 1px solid #c07800;
    box-shadow:
      inset 0 1px 0 rgba(255,240,180,.6),
      inset 0 -1px 1px rgba(100,50,0,.3),
      0 1px 2px rgba(0,0,0,.35);
  }
  .dot-min:hover {
    background:
      radial-gradient(circle at 50% 115%, #5a3800 0%, transparent 65%),
      radial-gradient(circle at 50% 50%,  #ffd060 25%, #f0a820 100%);
  }
  .dot-min:active {
    background: radial-gradient(circle at 50% 50%, #b07010 0%, #8a5808 100%);
    box-shadow: inset 0 1px 3px rgba(0,0,0,.5);
  }

  /* ── Maximise (green) ── */
  .dot-max {
    background:
      radial-gradient(circle at 50% 115%, #004d00 0%, transparent 65%),
      radial-gradient(circle at 50% 50%,  #5dda58 25%, #25a020 100%);
    border: 1px solid #1a8014;
    box-shadow:
      inset 0 1px 0 rgba(180,255,170,.55),
      inset 0 -1px 1px rgba(0,60,0,.3),
      0 1px 2px rgba(0,0,0,.35);
  }
  .dot-max:hover {
    background:
      radial-gradient(circle at 50% 115%, #003800 0%, transparent 65%),
      radial-gradient(circle at 50% 50%,  #78ee72 25%, #38b830 100%);
  }
  .dot-max:active {
    background: radial-gradient(circle at 50% 50%, #1a7014 0%, #0e5010 100%);
    box-shadow: inset 0 1px 3px rgba(0,0,0,.5);
  }

  .title {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    font-weight: 600;
    color: #222;
    text-shadow: 0 1px 0 rgba(255,255,255,.7);
    letter-spacing: .01em;
    text-wrap: nowrap;

  }

  .expand-btn {
    position: absolute;
    right: 10px;
    width: 14px; height: 14px;
    opacity: .5;
    cursor: pointer;
  }
  .expand-btn::before, .expand-btn::after {
    content: '';
    position: absolute;
    border: 1.5px solid #444;
  }
  .expand-btn::before { top: 0; right: 0; width: 8px; height: 8px; border-radius: 1px; }
  .expand-btn::after  { bottom: 0; left: 0; width: 8px; height: 8px; border-radius: 1px; }


/* ── Thumbnail cover (shown before first play) ── */
.reel__thumb-cover {
  position: absolute;
  inset: 0;
  z-index: 3;
  cursor: pointer;
  background: #000;
  transition: opacity .3s ease;
}
.reel__thumb-cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.reel__thumb-cover.hidden {
  opacity: 0;
  pointer-events: none;
}

/* iframe injected inside .reel viewport
   Oversized slightly so YouTube's bottom control bar is clipped off */
#reel-iframe {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: calc(100%); /* push YouTube's controls bar below the clip edge */
  border: none;
}

/* ── Brushed aluminium controls bar ── */
.reel__footer {
  background:
    repeating-linear-gradient(
      180deg,
      rgba(255,255,255,.22) 0px, rgba(255,255,255,.22) 1px,
      rgba(0,0,0,.055)      1px, rgba(0,0,0,.055)      2px,
      rgba(255,255,255,.06) 2px, rgba(255,255,255,.06)  3px,
      transparent           3px, transparent            5px
    ),
    linear-gradient(180deg,
      #d8d8d8 0%, #e2e2e2 8%, #d4d4d4 20%,
      #c8c8c8 35%, #bcbcbc 52%, #b4b4b4 65%,
      #bababa 78%, #c0c0c0 88%, #c8c8c8 100%
    );
  border-top: 1px solid #7a7a7a;
  padding: 7px 12px 9px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  position: relative;
  overflow: hidden;
}

.reel__footer::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: var(--reel-noise, none);
  background-repeat: repeat;
  opacity: .20;
  pointer-events: none;
  mix-blend-mode: overlay;
}

/* resize grip */
.reel__footer::after {
  content: '';
  position: absolute;
  right: 4px; bottom: 4px;
  width: 12px; height: 12px;
  background-image:
    radial-gradient(circle, #888 1px, transparent 1px),
    radial-gradient(circle, #888 1px, transparent 1px),
    radial-gradient(circle, #888 1px, transparent 1px),
    radial-gradient(circle, #888 1px, transparent 1px),
    radial-gradient(circle, #888 1px, transparent 1px),
    radial-gradient(circle, #888 1px, transparent 1px);
  background-size: 4px 4px;
  background-position: 0 0, 4px 0, 8px 0, 0 4px, 4px 4px, 8px 4px;
  background-repeat: no-repeat;
  opacity: .4;
}

/* ── Controls row ── */
.reel__controls {
  display: flex;
  align-items: center;
  gap: 7px;
  position: relative;
  z-index: 1;
}

.reel__transport {
  display: flex;
  gap: 3px;
  flex-shrink: 0;
}

.reel__btn {
  height: 24px;
  border-radius: 5px;
  border: 1px solid #7a7a7a;
  cursor: pointer;
  font-size: 9px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    repeating-linear-gradient(
      180deg,
      rgba(255,255,255,.15) 0px, rgba(255,255,255,.15) 1px,
      transparent 1px, transparent 3px
    ),
    linear-gradient(180deg, #e6e6e6 0%, #d0d0d0 45%, #c0c0c0 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.80),
    inset 0 -1px 0 rgba(0,0,0,.10),
    0 1px 2px rgba(0,0,0,.28);
  color: #1a1a1a;
  text-shadow: 0 1px 0 rgba(255,255,255,.6);
  transition: background .08s;
  padding: 0;
}
.reel__btn--icon { width: 24px; }
.reel__btn:hover {
  background:
    repeating-linear-gradient(
      180deg,
      rgba(255,255,255,.18) 0px, rgba(255,255,255,.18) 1px,
      transparent 1px, transparent 3px
    ),
    linear-gradient(180deg, #eeeeee 0%, #d8d8d8 45%, #c8c8c8 100%);
}
.reel__btn:active {
  background: linear-gradient(180deg, #b8b8b8 0%, #cccccc 100%);
  box-shadow: inset 0 1px 3px rgba(0,0,0,.38);
}

.reel__footer-label {
  font-size: 11px;
  font-weight: 600;
  color: #3a3a3a;
  text-shadow: 0 1px 0 rgba(255,255,255,.65);
  letter-spacing: .02em;
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.reel__footer-duration {
  font-family: 'Courier New', monospace;
  font-size: 10px;
  font-weight: 700;
  color: #444;
  text-shadow: 0 1px 0 rgba(255,255,255,.55);
  letter-spacing: .03em;
  flex-shrink: 0;
  padding-right: 16px;
}

.reel__btn {
    position: relative;
}

.reel__btn:after {
    content: '';
    position: absolute;
    top: 1px;
    width: 90%;
    height: 50%;
    border-radius: 3px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0.35) 100%);
    pointer-events: none;
}

.playlist__toggle-btn:after {
    content: '';
    position: absolute;
    top: 1px;
    left: 0px;
    width: 100%;
    height: 50%;
    border-radius: 3px;
    background: linear-gradient(180deg, rgba(255, 255, 255, .8) 0%, rgba(255, 255, 255, 0.2) 100%);
    pointer-events: none;
}

/* ── Progress bar ── */
.reel__progress-wrap {
  position: relative;
  width: 100%;
  z-index: 1;
  padding: 2px 0 1px;
}

.reel__progress-track {
  position: relative;
  height: 5px;
  border-radius: 3px;
  background: linear-gradient(180deg, #999 0%, #bbb 100%);
  box-shadow: inset 0 1px 2px rgba(0,0,0,.35), 0 1px 0 rgba(255,255,255,.6);
  cursor: pointer;
}

.reel__progress-fill {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 0%;
  border-radius: 3px;
  background: linear-gradient(180deg, #5b8fc8 0%, #3a6aad 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.3);
  pointer-events: none;
  transition: width .25s linear;
}

.reel__progress-thumb {
  position: absolute;
  top: 50%;
  left: 0%;
  transform: translate(-50%, -50%);
  width: 11px; height: 11px;
  border-radius: 50%;
  background: radial-gradient(circle at 38% 35%, #f0f0f0, #c0c0c0);
  border: 1px solid #888;
  box-shadow: 0 1px 3px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.7);
  pointer-events: none;
  transition: left .25s linear;
}

.reel {
  position: relative;
  overflow: hidden;
  width: 100%;
  padding-top: 56.25%; /* 16:9 Aspect Ratio (divide 9 by 16 = 0.5625) */
}

.reel iframe {
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  right: 0;
  width: 100%;
  height: 100%;
  border-radius: 0;
}

/* ══════════════════════════════════════════
   PLAYLIST — slides out from behind the window
══════════════════════════════════════════ */

/* Shell: positioning root, no overflow clip — lets playlist escape */
/* Centering wrapper — CSS transition for playlist open/close shift */
.player__center {
  /* width: calc(32rem * 1.2);
  margin-left: calc(32rem - 50%); */
  transition: transform .38s cubic-bezier(.4,0,.2,1);
  z-index: 99;
  
  width: calc(30rem * 1.2);
}

.player__shell {
  position: relative;
  will-change: transform;
}

.reel__wrapper {
  position: relative;
  z-index: 2; /* window sits on top of playlist */
}

/* ── Playlist ──
   Absolute to .player__shell, top-right corner.
   Closed: translateX(0) — hidden behind the window (same right edge, z-index 1).
   Open:   translateX(100%) — fully revealed to the right of the window. */
.playlist {
  position: absolute;
  top: 0;
  right: -16px;
  width: 250px;
  height: 100%;
  display: flex;
  flex-direction: column;
  border-radius: 0 10px 10px 0;
  border: 1px solid rgba(0,0,0,.52);
  border-left: 1px solid #7a7a7a;
  z-index: 1; /* behind .reel__wrapper */
  overflow: hidden;
  transform: translateX(0) scale(0.98);
  box-shadow: none;
  transition: transform .4s cubic-bezier(.4,0,.2,1),
              opacity   .28s ease,
              box-shadow .3s ease,
              right .3s ease;
  opacity: 1;
  pointer-events: none;
  
}

.playlist.open {
  transform: translateX(100%);
  right: 10px;
  opacity: 1;
  pointer-events: all;
  box-shadow: 0 20px 60px -10px rgba(0,0,0,.3);
}

/* ── Playlist header — aluminium titlebar style ── */
.playlist__header {
  height: 28px;
  flex-shrink: 0;
  background:
    repeating-linear-gradient(
      180deg,
      rgba(255,255,255,.20) 0px, rgba(255,255,255,.20) 1px,
      rgba(0,0,0,.045)      1px, rgba(0,0,0,.045)      2px,
      transparent           2px, transparent            3px
    ),
    linear-gradient(180deg,
      #f2f2f2 0%, #e0e0e0 15%, #d2d2d2 35%,
      #c6c6c6 52%, #bcbcbc 68%, #c4c4c4 84%, #cecece 100%
    );
  border-bottom: 1px solid #7e7e7e;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.95);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 8px 0 20px;
  white-space: nowrap;
}

.playlist__title {
  font-size: 11.5px; font-weight: 700;
  color: #222;
  text-shadow: 0 1px 0 rgba(255,255,255,.65);
  letter-spacing: .01em;
}

/* Toggle button in window titlebar */
.playlist__toggle-btn {
  height: 18px; padding: 0 7px;
  border: 1px solid #7a7a7a; border-radius: 4px;
  background:
    repeating-linear-gradient(180deg, rgba(255,255,255,.15) 0px, rgba(255,255,255,.15) 1px, transparent 1px, transparent 3px),
    linear-gradient(180deg, #e6e6e6 0%, #d0d0d0 45%, #c0c0c0 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 1px 1px rgba(0,0,0,.2);
  cursor: pointer;
  display: flex; align-items: center; gap: 4px;
  font-size: 9px; font-weight: 700; color: #333;
  text-shadow: 0 1px 0 rgba(255,255,255,.6);
  white-space: nowrap; letter-spacing: .03em; flex-shrink: 0;
}
.playlist__toggle-btn:hover  { background: linear-gradient(180deg, #eee, #d4d4d4); }
.playlist__toggle-btn:active { background: linear-gradient(180deg, #bbb, #ccc); }
.playlist__toggle-btn svg {
  transition: transform .36s cubic-bezier(.4,0,.2,1);
  flex-shrink: 0;
}
.playlist__toggle-btn.is-open svg { transform: rotate(180deg); }

/* Scrollable list */
.playlist__list {
  list-style: none; overflow-y: auto; flex: 1; padding: 0 0 3px 10px;
  background:
    repeating-linear-gradient(180deg, rgba(255,255,255,.09) 0px, rgba(255,255,255,.09) 1px, transparent 1px, transparent 3px),
    linear-gradient(180deg, #f7f7f7 0%, #e7e7e7 100%);
}
.playlist__list::-webkit-scrollbar { width: 4px; }
.playlist__list::-webkit-scrollbar-track { background: rgba(0,0,0,.05); }
.playlist__list::-webkit-scrollbar-thumb { background: #aaa; border-radius: 2px; }

/* Individual item */
.playlist__item {
  display: flex; align-items: center; gap: 7px;
  padding: 6px 8px; cursor: pointer;
  border-bottom: 1px solid rgba(0,0,0,.07); transition: background .1s;
}
.playlist__item:last-child { border-bottom: none; }
.playlist__item:hover { background: rgba(0,0,255,.07); }
.playlist__item.active {
  background: linear-gradient(90deg, #0000ff1a, #0000ff09);
  border-left: 3px solid #0000ff; padding-left: 5px;
}

.playlist__thumb {
  width: 60px; height: auto; border-radius: 2px;
  object-fit: cover; flex-shrink: 0; background: #bbb;
  box-shadow: 0 1px 3px rgba(0,0,0,.22);
}

.playlist__info { flex: 1; min-width: 0; }
.playlist__name {
  font-size: 10px; font-weight: 600; color: #1a1a2e;
  text-shadow: 0 1px 0 rgba(255,255,255,.5);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2;
}
.playlist__meta { font-size: 8.5px; color: #777; line-height: 2em; }
.playlist__item.active .playlist__name { color: #1a3a6a; }

/* Animated now-playing bars */
.playlist__now-playing { display: none; align-items: flex-end; gap: 1.5px; height: 11px; flex-shrink: 0; }
.playlist__item.active .playlist__now-playing { display: flex; }
.playlist__now-playing span {
  display: none; width: 2.5px; background: #0000ff; border-radius: 1px;
  animation: plbars .9s ease-in-out infinite alternate;
}
.playlist__now-playing span:nth-child(1) { height: 4px;  animation-delay: 0s; }
.playlist__now-playing span:nth-child(2) { height: 9px;  animation-delay: .2s; }
.playlist__now-playing span:nth-child(3) { height: 6px;  animation-delay: .4s; }
@keyframes plbars { from { transform: scaleY(.25); } to { transform: scaleY(1); } }

                <button class="reel__btn reel__btn--icon" id="reel-fullscreen" title="Fullscreen">
                  <svg width="11" height="11" viewBox="0 0 11 11" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M1 4V1h3M7 1h3v3M10 7v3H7M4 10H1V7"></path></svg>
                </button>
              </div>

<div class="reel__progress-wrap">
              <div class="reel__progress-track" id="reel-track">
                <div class="reel__progress-fill" id="reel-fill" style="width: 99.3066%;"></div>
                <div class="reel__progress-thumb" id="reel-thumb" style="left: 99.3066%;"></div>
              </div>
            </div>
              
              <span class="reel__footer-duration"><span id="reel-cur">1:00</span> / <span id="reel-dur">1:01</span></span>
            </div>
          </div>

        </div><!-- /reel__wrapper.window -->

        <!-- playlist lives OUTSIDE .window so overflow:hidden doesn't clip it -->
        <div class="playlist open" id="playlist">

          <div class="playlist__header">
            <span class="playlist__title">Playlist</span>
            <span style="font-size:9px;color:#5c5c5c;">5 videos</span>
          </div>

          <ul class="playlist__list" id="playlist-list">
            <!-- Items rendered by JS from VIDEOS array below — just edit that array -->
          </ul>
        </div><!-- /playlist -->

        </div><!-- /player__shell -->
        </div><!-- /player__center -->
    
        <div class="footer__wrapper">
            <footer>

            <div class="socials">
                <a href="https://x.com/swoodipto" target="_blank" class="twitter__Hover">Twitter ↗</a> 
                <a href="https://instagram.com/swoodipto" target="_blank" class="insta__Hover">Instagram ↗</a> 
                <a href="https://youtube.com/@swoodipto" target="_blank" class="yt__Hover">YouTube ↗</a>
            </div>

            <div class="sign__wrap">
                <div class="sign__from">From 🐻 Berlin. With 💖 Love,</div>
                <div class="sign">
                    <svg viewBox="0 0 360 280" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M45.9736 247.152L48.4805 251.494C57.2678 266.714 76.7297 271.929 91.9498 263.142L92.9166 262.584C107.603 254.104 112.635 235.325 104.156 220.639V220.639C98.6065 211.028 88.3028 205.159 77.2053 205.289L36.0714 205.769C26.7795 205.878 18.1521 200.964 13.5058 192.916V192.916C6.40624 180.619 10.6194 164.896 22.9162 157.796L28.0565 154.828C41.5902 147.015 58.8956 151.652 66.7092 165.185L71.0604 172.722C76.471 182.093 88.4541 185.304 97.8255 179.893V179.893C107.197 174.483 110.408 162.5 104.997 153.128L95.9029 137.377C90.7087 128.38 93.7912 116.876 102.788 111.682V111.682C111.784 106.488 123.288 109.57 128.482 118.567L169.547 189.693C176.398 201.56 172.125 216.852 160.259 223.703V223.703C148.619 230.424 133.532 226.553 126.812 214.913V214.913C120.092 203.273 124.08 188.389 135.72 181.669L148.686 174.182C167.487 163.328 173.929 139.287 163.074 120.486L159.473 114.249" stroke="black" stroke-width="10" stroke-linecap="round"/>
                        <path d="M186.768 120.771L205.457 109.981C217.11 103.253 221.102 88.3531 214.374 76.7003L213.678 75.4949C207.335 64.5079 193.286 60.7434 182.299 67.0868V67.0868C171.312 73.4302 167.547 87.4793 173.891 98.4663L205.071 152.473C214.404 168.637 235.072 174.175 251.236 164.843V164.843C267.4 155.511 272.938 134.842 263.606 118.678L220.94 44.7776" stroke="black" stroke-width="10" stroke-linecap="round"/>

            </footer>

    </div>

<script>
  // ════════════════════════════════════════
  // ✏️  EDIT YOUR PLAYLIST HERE
  //     Just add/remove objects. Everything
  //     else is automatic.
  // ════════════════════════════════════════
  var VIDEOS = [
    { id: 'DvQmSE5fzUo', name: '10-Year Motion Reel.mp4', meta: '2014—24' },
    { id: 'HE5LyLU0Br0', name: 'Hygraph Promo.mp4', meta: 'Motion + Brand' },
    { id: 'LxdpN6oTSGk', name: 'Live Preview Promo.mp4', meta: 'Motion, Visuals, Sound Design' },
    { id: 'BiyEMDINb50', name: 'Rebooting.mp4', meta: 'Motion, Visuals, Sound Design' },
    { id: 'mZBSUtCIRC8', name: 'ProBackMusic / K-391.mp4', meta: 'Motion, Visuals' },
    { id: '8Xi4yuiBdAY', name: 'Stranger Things.mp4', meta: 'Motion, Visuals, Sound Design' },
  ];
  // ════════════════════════════════════════

  // Thumbnail helper — always uses the video's own ID
  function thumb(id, size) {
    // size: 'mqdefault' (320×180) or 'maxresdefault' (1280×720, falls back)
    return 'https://i.ytimg.com/vi/' + id + '/' + (size || 'mqdefault') + '.jpg';
  }

  // ── Build playlist items from VIDEOS array ──
  var currentIndex = 0;
  var listEl = document.getElementById('playlist-list');
  listEl.innerHTML = '';
  VIDEOS.forEach(function(v, i) {
    var li = document.createElement('li');
    li.className = 'playlist__item' + (i === 0 ? ' active' : '');
    li.setAttribute('data-index', i);
    li.innerHTML =
      '<img class="playlist__thumb" src="' + thumb(v.id) + '" alt="">' +
      '<div class="playlist__info">' +
        '<div class="playlist__name">' + v.name + '</div>' +
        '<div class="playlist__meta">' + v.meta + '</div>' +
      '</div>' +
      '<div class="playlist__now-playing"><span></span><span></span><span></span></div>';
    listEl.appendChild(li);
  });

  // Set initial main thumbnail from first video
  var mainImg = document.getElementById('reel-thumb-img');
  mainImg.src = thumb(VIDEOS[0].id, 'maxresdefault');
  mainImg.onerror = function(){ this.src = thumb(VIDEOS[0].id, 'hqdefault'); this.onerror = null; };

  // Update video count in header
  var countEl = document.querySelector('.playlist__header span:last-child');
  if (countEl) countEl.textContent = VIDEOS.length + ' video' + (VIDEOS.length !== 1 ? 's' : '');

  // ── Aluminium noise grain ──
  (function() {
    var sz = 128, c = document.createElement('canvas');
    c.width = c.height = sz;
    var ctx = c.getContext('2d'), img = ctx.createImageData(sz, sz);
    for (var i = 0; i < img.data.length; i += 4) {
      var row = Math.floor(i / 4 / sz);
      var v = 128 + (Math.random() * 80 - 40) + Math.sin(row * 0.7) * 12;
      img.data[i] = img.data[i+1] = img.data[i+2] = v; img.data[i+3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    var f = document.querySelector('.reel__footer');
    if (f) f.style.setProperty('--reel-noise', 'url(' + c.toDataURL() + ')');
  })();

  // ── YouTube IFrame API ──
  var reelPlayer  = null;
  var reelPlaying = false;
  var reelRafId   = null;
  var playerReady = false;
  var pendingVideoId = null;

  (function(){
    var s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  })();

  window.onYouTubeIframeAPIReady = function() {
    var viewport = document.getElementById('reel-viewport');
    var iframe   = document.createElement('iframe');
    iframe.id    = 'reel-iframe';
    iframe.src   = 'https://www.youtube.com/embed/' + VIDEOS[0].id +
      '?enablejsapi=1&controls=0&modestbranding=1' +
      '&rel=0&iv_load_policy=3&playsinline=1&autoplay=0&fs=1';
    iframe.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
    iframe.allowFullscreen = true;
    viewport.appendChild(iframe);

    reelPlayer = new YT.Player('reel-iframe', {
      events: {
        onReady: function(e) {
          playerReady = true;
          var dur = e.target.getDuration();
          if (dur) document.getElementById('reel-dur').textContent = fmtTime(dur);
          if (pendingVideoId) {
            reelPlayer.loadVideoById(pendingVideoId);
            pendingVideoId = null;
          }
        },
        onStateChange: function(e) {
          reelPlaying = (e.data === YT.PlayerState.PLAYING);
          var iconSvg = document.getElementById('icon-playpause');
          if (iconSvg) iconSvg.innerHTML = reelPlaying
            ? '<rect x="1" y="0" width="3" height="11"/><rect x="6" y="0" width="3" height="11"/>'
            : '<polygon points="0,0 10,5.5 0,11"/>';
          if (reelPlaying) {
            var cover = document.getElementById('reel-thumb-cover');
            if (cover) cover.classList.add('hidden');
            tickProgress();
          } else {
            cancelAnimationFrame(reelRafId);
          }
          var dur = reelPlayer.getDuration();
          if (dur) document.getElementById('reel-dur').textContent = fmtTime(dur);
        }
      }
    });
  };

  function fmtTime(s) {
    s = Math.floor(s);
    return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
  }

  function tickProgress() {
    if (!reelPlayer || !reelPlaying) return;
    var cur = reelPlayer.getCurrentTime();
    var dur = reelPlayer.getDuration();
    var pct = dur ? (cur / dur * 100) : 0;
    document.getElementById('reel-fill').style.width = pct + '%';
    document.getElementById('reel-thumb').style.left = pct + '%';
    document.getElementById('reel-cur').textContent  = fmtTime(cur);
    reelRafId = requestAnimationFrame(tickProgress);
  }

  function doPlay() {
    if (!playerReady) return;
    reelPlaying ? reelPlayer.pauseVideo() : reelPlayer.playVideo();
  }

  // Thumbnail click → start playing, hide cover
  document.getElementById('reel-thumb-cover').addEventListener('click', function() {
    if (playerReady) {
      reelPlayer.playVideo();
    }
  });

  // ── Load a video by index ──
  function loadVideoByIndex(idx) {
    var v = VIDEOS[idx];
    if (!v) return;
    currentIndex = idx;

    // Update title bar + footer label
    var tb = document.getElementById('reel-title-bar');
    var fl = document.getElementById('reel-footer-label');
    if (tb) tb.textContent = v.name;
    if (fl) fl.textContent = v.name + ' / ' + v.meta;

    // Reset progress
    document.getElementById('reel-fill').style.width = '0%';
    document.getElementById('reel-thumb').style.left = '0%';
    document.getElementById('reel-cur').textContent  = '0:00';
    document.getElementById('reel-dur').textContent  = '--:--';
    cancelAnimationFrame(reelRafId);
    reelPlaying = false;
    var iconSvg = document.getElementById('icon-playpause');
    if (iconSvg) iconSvg.innerHTML = '<polygon points="0,0 10,5.5 0,11"/>';

    // Swap main thumbnail
    var cover = document.getElementById('reel-thumb-cover');
    var img   = document.getElementById('reel-thumb-img');
    img.src   = thumb(v.id, 'maxresdefault');
    img.onerror = function(){ this.src = thumb(v.id, 'hqdefault'); this.onerror = null; };
    cover.classList.remove('hidden');

    // Load into player
    if (playerReady) {
      reelPlayer.loadVideoById(v.id);
    } else {
      pendingVideoId = v.id;
    }

    // Update active state in list
    document.querySelectorAll('.playlist__item').forEach(function(el, i) {
      el.classList.toggle('active', i === idx);
    });
  }

  document.getElementById('reel-playpause').addEventListener('click', doPlay);
  document.getElementById('reel-prev').addEventListener('click', function() {
    if (!playerReady) return;
    reelPlayer.seekTo(0);
    if (!reelPlaying) reelPlayer.playVideo();
  });
  document.getElementById('reel-next').addEventListener('click', function() {
    if (!playerReady) return;
    var dur = reelPlayer.getDuration();
    if (dur) { reelPlayer.seekTo(dur - 5); if (!reelPlaying) reelPlayer.playVideo(); }
  });
  document.getElementById('reel-fullscreen').addEventListener('click', function() {
    var iframe = document.getElementById('reel-iframe');
    if (!iframe) return;
    var req = iframe.requestFullscreen || iframe.webkitRequestFullscreen || iframe.mozRequestFullScreen || iframe.msRequestFullscreen;
    if (req) req.call(iframe);
  });
  document.getElementById('dot-reel-fullscreen').addEventListener('click', function() {
    var iframe = document.getElementById('reel-iframe');
    if (!iframe) return;
    var req = iframe.requestFullscreen || iframe.webkitRequestFullscreen || iframe.mozRequestFullScreen || iframe.msRequestFullscreen;
    if (req) req.call(iframe);
  });

  // Progress bar scrub
  var scrubbing = false;
  function scrubTo(e) {
    if (!playerReady) return;
    var track = document.getElementById('reel-track');
    var rect  = track.getBoundingClientRect();
    var pct   = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    var dur   = reelPlayer.getDuration();
    if (dur) reelPlayer.seekTo(pct * dur);
  }
  document.getElementById('reel-track').addEventListener('mousedown', function(e) {
    scrubbing = true; scrubTo(e); e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) { if (scrubbing) scrubTo(e); });
  document.addEventListener('mouseup',   function()  { scrubbing = false; });

  // Playlist item clicks
  document.getElementById('playlist-list').addEventListener('click', function(e) {
    var item = e.target.closest('.playlist__item');
    if (!item) return;
    var idx = parseInt(item.getAttribute('data-index'), 10);
    loadVideoByIndex(idx);
  });

  // ── Playlist centering (CSS transition on outer wrapper) ──
  var PLAYLIST_SIDE_W = 250;
  var centerEl = document.querySelector('.player__center');

  function computeOffset(isOpen) {
    if (!isOpen) return { x: 0, y: 0 };
    if (window.innerWidth <= 1024) {
      var panel = document.getElementById('playlist');
      var h = panel ? panel.offsetHeight : 220;
      return { x: 0, y: -Math.round(h / 2) };
    }
    return { x: -Math.round(PLAYLIST_SIDE_W / 2), y: 0 };
  }

  function setCenterOffset(isOpen) {
    var o = computeOffset(isOpen);
    centerEl.style.transform = o.x === 0 && o.y === 0
      ? '' : 'translate(' + o.x + 'px,' + o.y + 'px)';
  }

  // Apply immediately (no transition on first paint)
  centerEl.style.transition = 'none';
  setCenterOffset(true);
  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      centerEl.style.transition = '';
    });
  });

  // ── Playlist toggle ──
  (function() {
    var panel = document.getElementById('playlist');
    var btn   = document.getElementById('playlist-toggle');
    var open  = true;
    btn.classList.add('is-open');

    function setOpen(val) {
      open = val;
      panel.classList.toggle('open', open);
      btn.classList.toggle('is-open', open);
      setCenterOffset(open);
    }

    function scheduleClose() {
      setTimeout(function() { setOpen(false); }, 1000);
    }
    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', scheduleClose);
    } else {
      scheduleClose();
    }

    btn.addEventListener('click', function(e) { e.stopPropagation(); setOpen(!open); });
    window.addEventListener('resize', function() { setCenterOffset(open); });
  })();

  // ── Drag-me bubble ──
var bubble = document.getElementById('drag-bubble');
var bubbleDismissed = false;
bubble.style.display = 'none';
setTimeout(function() { bubble.style.display = ''; }, 1400);
function dismissBubble() {
  if (bubbleDismissed || !bubble || bubble.style.display === 'none') return;
  bubbleDismissed = true;
  bubble.classList.add('bubble-out');
  setTimeout(function() { bubble.style.display = 'none'; }, 300);
}

  // ── Spring-drag (writes only to player__shell) ──
  (function() {
    var win      = document.querySelector('.player__shell');
    var titlebar = win.querySelector('.titlebar');
    var cx=0,cy=0,vx=0,vy=0,dragging=false,dragStartX=0,dragStartY=0,baseX=0,baseY=0,rafId=null;
    var STIFFNESS=0.2, DAMPING=0.7, REST=0.15;
    function applyTransform(){ win.style.transform='translate('+cx+'px,'+cy+'px)'; }
    function springStep(){
      if(dragging)return;
      vx=(vx-STIFFNESS*cx)*DAMPING; vy=(vy-STIFFNESS*cy)*DAMPING;
      cx+=vx; cy+=vy; applyTransform();
      if(Math.abs(cx)>REST||Math.abs(cy)>REST||Math.abs(vx)>REST||Math.abs(vy)>REST){
        rafId=requestAnimationFrame(springStep);
      } else { cx=cy=vx=vy=0; applyTransform(); }
    }
    function startDrag(px,py){
      if(rafId)cancelAnimationFrame(rafId);
      dragging=true; dragStartX=px; dragStartY=py; baseX=cx; baseY=cy; vx=vy=0;
      titlebar.classList.add('dragging');
      dismissBubble();
    }
    function moveDrag(px,py){ if(!dragging)return; cx=baseX+(px-dragStartX); cy=baseY+(py-dragStartY); applyTransform(); }
    function endDrag(){ if(!dragging)return; dragging=false; titlebar.classList.remove('dragging'); vx=cx*0.07; vy=cy*0.07; rafId=requestAnimationFrame(springStep); }
    titlebar.addEventListener('mousedown',function(e){ if(e.target.classList.contains('dot')||e.target.closest('.playlist__toggle-btn'))return; startDrag(e.clientX,e.clientY); e.preventDefault(); });
    document.addEventListener('mousemove',function(e){ moveDrag(e.clientX,e.clientY); });
    document.addEventListener('mouseup',function(){ endDrag(); });
    titlebar.addEventListener('touchstart',function(e){ if(e.target.classList.contains('dot')||e.target.closest('.playlist__toggle-btn'))return; var t=e.touches[0]; startDrag(t.clientX,t.clientY); e.preventDefault(); },{passive:false});
    document.addEventListener('touchmove',function(e){ var t=e.touches[0]; moveDrag(t.clientX,t.clientY); },{passive:false});
    document.addEventListener('touchend',function(){ endDrag(); });
    var toggleBtn=document.getElementById('playlist-toggle');
    if(toggleBtn){ toggleBtn.addEventListener('touchend',function(e){ e.preventDefault(); toggleBtn.click(); }); }
  })();
</script>
